name: Deploy Production

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/lexilink:${GITHUB_SHA}"
          latest="ghcr.io/${owner}/lexilink:latest"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-web:
    name: Build admin web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build admin web bundle
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=LEXILINK_API_BASE_URL=https://api.wordlope.com \
            --dart-define=LEXILINK_ENABLE_ADMIN=true

      - name: Archive admin web bundle
        run: tar -czf admin-web.tar.gz -C frontend/build/web .

      - name: Upload admin web artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web
          path: admin-web.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - build
      - build-admin-web
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/lexilink_prod
          chmod 600 ~/.ssh/lexilink_prod
          ssh-keyscan -p "${{ secrets.PROD_SSH_PORT || '22' }}" "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Download admin web artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-web
          path: admin-web

      - name: Upload admin web artifact
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/lexilink_prod -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "install -d -m 700 /tmp/lexilink-deploy && cat > /tmp/lexilink-deploy/admin-web-${GIT_SHA}.tar.gz" \
            < admin-web/admin-web.tar.gz

      - name: Deploy image and admin web
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/lexilink_prod -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' IMAGE='$IMAGE' GIT_SHA='$GIT_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/lexilink/app

          if [[ -n "${GHCR_TOKEN:-}" ]]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi

          git fetch --prune origin
          git checkout --force "$GIT_SHA"

          admin_web_root="$(grep -E '^ADMIN_WEB_ROOT=' .env | cut -d= -f2- | tr -d '\r' || true)"
          admin_web_root="${admin_web_root:-./frontend/build/web}"
          if [[ "$admin_web_root" != /* ]]; then
            admin_web_root="/opt/lexilink/app/${admin_web_root#./}"
          fi

          admin_web_roots=("$admin_web_root")
          caddy_container="$(docker compose ps -q caddy 2>/dev/null || true)"
          if [[ -n "$caddy_container" ]]; then
            mounted_admin_root="$(docker inspect "$caddy_container" \
              --format '{{range .Mounts}}{{if eq .Destination "/srv/admin"}}{{.Source}}{{end}}{{end}}')"
            if [[ -n "$mounted_admin_root" && "$mounted_admin_root" != "$admin_web_root" ]]; then
              admin_web_roots+=("$mounted_admin_root")
            fi
          fi

          admin_web_archive="/tmp/lexilink-deploy/admin-web-${GIT_SHA}.tar.gz"
          test -f "$admin_web_archive"
          for root in "${admin_web_roots[@]}"; do
            echo "Deploying admin web to $root"
            mkdir -p "$root"
            find "$root" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar -xzf "$admin_web_archive" -C "$root"
            test -f "$root/index.html"
          done

          LEXILINK_IMAGE="$IMAGE" ./scripts/deploy.sh
          curl -fsS https://api.wordlope.com/health/ready
          curl -fsS https://wordlope.com/support/ >/dev/null
          curl -fsS https://wordlope.com/privacy/ >/dev/null
          curl -fsS https://admin.wordlope.com/admin/login >/dev/null
          curl -fsS https://admin.wordlope.com/main.dart.js | grep -q '/admin/players/by-handle'
          REMOTE
