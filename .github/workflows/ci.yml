name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPNETCORE_LexiLink_IntegrationTests_ConnectionString: Host=localhost;Port=5432;Database=lexilink;Username=lexiadmin;Password=0852

jobs:
  android-release:
    name: Android release gate
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ci-validation-only
      ANDROID_KEY_ALIAS: ci-upload
      ANDROID_KEY_PASSWORD: ci-validation-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        run: flutter test

      - name: Create ephemeral CI signing key
        run: >-
          keytool -genkeypair -noprompt
          -keystore "$ANDROID_KEYSTORE_PATH"
          -storepass "$ANDROID_KEYSTORE_PASSWORD"
          -alias "$ANDROID_KEY_ALIAS"
          -keypass "$ANDROID_KEY_PASSWORD"
          -keyalg RSA -keysize 4096 -validity 2
          -dname "CN=WordLope CI Validation"

      - name: Build production-configured release AAB
        working-directory: frontend
        run: >-
          flutter build appbundle --release
          --dart-define-from-file=config/android-production.json

      - name: Verify release AAB
        run: ./scripts/verify-android-aab.sh

  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lexilink
          POSTGRES_USER: lexiadmin
          POSTGRES_PASSWORD: "0852"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexiadmin -d lexilink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LexiLink.sln --disable-build-servers -v minimal

      - name: Build
        run: dotnet build LexiLink.sln --no-restore --disable-build-servers -v minimal -m:1

      - name: Apply database migrations
        run: >
          dotnet run
          --project src/Database/LexiLink.DatabaseMigrator/LexiLink.DatabaseMigrator.csproj
          --no-restore
          --
          "$ASPNETCORE_LexiLink_IntegrationTests_ConnectionString"
          src/Database/LexiLink.Database/Structure

      - name: Test
        run: ./scripts/test.sh --no-restore -v minimal
