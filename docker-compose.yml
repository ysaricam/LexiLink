# LexiLink production stack — single Hetzner Ubuntu VPS.
#
#   caddy (auto-HTTPS) ── reverse proxy ──> api (:8080)
#   migrate (one-shot, runs before api) ──> postgres
#   api ──> postgres
#
# Bring up:   docker compose --env-file /opt/lexilink/.env up -d --build
# Migrate runs to completion first; api waits for it; caddy fronts api with TLS.
# All config/secrets come from the .env file (see .env.example). Never commit .env.

name: lexilink

# Shared image/build/env for the two services that run the LexiLink image.
x-app: &app
  image: ${LEXILINK_IMAGE:-lexilink:local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot DbUp migrator. Overrides the image ENTRYPOINT to run the migrator
  # against /app/Database/Structure (shipped in the image via the API publish).
  # $$ escapes to a literal $ so the connection string is read inside the
  # container from the env_file, never interpolated into the compose file.
  migrate:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - dotnet /app/migrator/LexiLink.DatabaseMigrator.dll "$$ConnectionStrings__LexiLinkDb" /app/Database/Structure
    restart: "no"

  api:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      LEXILINK_DOMAIN: ${LEXILINK_DOMAIN}
      LEXILINK_ACME_EMAIL: ${LEXILINK_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
